<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haptic Lab — 触摸板振动对比台</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --panel-2: #23272f;
    --line: #2e343e;
    --text: #e6e8ec;
    --muted: #93a0b4;
    --accent: #6ea8fe;
    --done: #57c98a;
    --blocked: #f0a35e;
    --demo: #8b93a7;
    --warn: #e06c75;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 80px;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(20,22,26,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 13px; font: inherit; cursor: pointer;
    transition: background .12s, border-color .12s, transform .06s;
  }
  button:hover { background: #2b313a; border-color: #3d4654; }
  button:active { transform: scale(.97); }
  button.primary { background: #24405f; border-color: #35618f; }
  button.primary:hover { background: #2c4f75; }
  button.ghost { background: transparent; }
  button.tiny { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
  input[type=number], select {
    background: #171a20; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; font: inherit; width: 74px;
  }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  .status { color: var(--muted); font-size: 12px; min-height: 18px; }
  .status.err { color: var(--warn); }
  main { padding: 20px; display: flex; flex-direction: column; gap: 26px; }
  section > h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
    display: flex; gap: 10px; align-items: baseline;
  }
  section > h2 span { text-transform: none; letter-spacing: 0; font-weight: 400; color: #6d7788; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
    border-left: 3px solid var(--demo);
  }
  .card[data-role=done] { border-left-color: var(--done); }
  .card[data-role=blocked] { border-left-color: var(--blocked); }
  .card.playing { box-shadow: 0 0 0 1px #3f6ea8, 0 0 22px rgba(110,168,254,.25); }
  .card-head { display: flex; align-items: baseline; gap: 8px; }
  .card-head .id { font: 600 13px ui-monospace, "SF Mono", monospace; color: var(--accent); }
  .card-head .label { color: var(--text); font-size: 13px; }
  .card-head .key { margin-left: auto; color: #5b6474; font: 11px ui-monospace, monospace; }
  .timeline {
    display: flex; align-items: stretch; height: 30px; gap: 0;
    background: #12141a; border: 1px solid #232833; border-radius: 8px; padding: 3px 4px; overflow: hidden;
  }
  .on-seg { border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font: 10px ui-monospace, monospace; color: #0d1015; min-width: 3px; overflow: hidden; }
  .off-seg { background: repeating-linear-gradient(90deg, #1a1e26 0 2px, transparent 2px 5px); min-width: 0; }
  .metrics { display: flex; gap: 14px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .metrics b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .metrics .warn { color: var(--warn); }
  .softness { position: relative; height: 16px; background: #12141a; border: 1px solid #232833;
    border-radius: 8px; overflow: hidden; display: flex; align-items: center; }
  .softness .bar { position: absolute; left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, #4a6b52, #7bc48f); opacity: .55; }
  .softness .val { position: relative; font: 11px ui-monospace, monospace; color: #cfd6e2; padding-left: 8px; }
  .softness .unit { color: #5b6474; }
  .row { display: flex; gap: 8px; align-items: center; }
  .seq { font: 11px ui-monospace, monospace; color: #6d7788; word-break: break-all;
    background: #12141a; border: 1px solid #232833; border-radius: 6px; padding: 6px 8px; }
  .editor { display: none; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .card.editing .editor { display: flex; }
  .note-row { display: grid; grid-template-columns: 18px 62px 62px 88px 1fr 1fr 22px; gap: 6px; align-items: center; font-size: 12px; }
  .note-row .idx { color: #5b6474; font: 11px ui-monospace, monospace; }
  .note-row label { color: var(--muted); font-size: 11px; }
  .note-row .sl { display: flex; align-items: center; gap: 4px; }
  .note-row .sl output { font: 11px ui-monospace, monospace; color: var(--muted); width: 26px; }
  .note-row button { padding: 0 6px; font-size: 12px; }
  footer { color: #6d7788; font-size: 12px; padding: 8px 22px; border-top: 1px solid var(--line); }
  footer code { color: #93a0b4; }
  .legend { display: flex; gap: 16px; color: #6d7788; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Haptic Lab <small>点一下 = 振一次（私有 MTActuator，无需手指在触摸板上）</small></h1>
  <div class="toolbar">
    <label class="status">排序 <select id="sort">
      <option value="group">分组（默认）</option>
      <option value="soft">轻柔度：最柔在前</option>
      <option value="harsh">轻柔度：最强在前</option>
      <option value="length">总长：短在前</option>
      <option value="peak">峰值强度：低在前</option>
      <option value="duty">占空比：低在前</option>
    </select></label>
    <label class="status">对比间隔 <input type="number" id="gap" value="700" min="0" step="100"> ms</label>
    <button id="reload" class="ghost" title="从 presets.json 重新载入（无需刷新页面）">⟳ 刷新预设</button>
    <button id="compare" class="primary">▶ 全部依次对比</button>
    <button id="stop">■ 停</button>
    <span id="status" class="status"></span>
  </div>
</header>

<main id="groups"></main>

<footer>
  数字键 <code>1</code>–<code>9</code> 播放对应卡片 · <code>Esc</code> 停 · 每张卡片可展开编辑（时长/波形/强度/音色）并保存回
  <code>presets.json</code> · 波形：1 back · 2 click · 3 weak buzz · 4 light tap · 5 medium tap · 6 strong tap · 15/16 low thud · 音色 frequency 0.4 ≈ 最清脆
</footer>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const statusEl = $("#status");
let presets = [];
let ordered = [];
let stopFlag = false;

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("err", isError);
}

async function api(path, body) {
  const response = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}

function sequenceOf(notes) {
  return notes.map(n => `${n.on},${n.off},${n.waveform},${n.intensity},${n.frequency}`).join(";");
}

function timeline(notes) {
  const total = notes.reduce((sum, n) => sum + n.on + n.off, 0) || 1;
  return notes.map(n => {
    const onPct = (n.on / total) * 100;
    const offPct = (n.off / total) * 100;
    const hue = 205 - (n.frequency / 2) * 150;
    const light = 34 + n.intensity * 16;
    return `<div class="on-seg" style="width:${onPct}%;background:hsl(${hue} 72% ${light}%)" title="on ${n.on}ms · wave ${n.waveform} · I ${n.intensity} · f ${n.frequency}">${n.on >= 90 && onPct > 8 ? n.on : ""}</div>`
      + (n.off > 0 ? `<div class="off-seg" style="width:${offPct}%"></div>` : "");
  }).join("");
}

// 轻柔度：0 = 很硬，100 = 指腹轻碰。综合振幅、波形、音色是否压共振峰、
// 占空比、以及是否存在连续驱动段（连续的会糊成"嗡"，主观上更重）。
const WAVE_SOFT = { 1: 1.0, 3: 1.15, 5: 1.35, 2: 1.5, 4: 1.5, 6: 1.7, 15: 2.0, 16: 2.1 };

function softness(preset) {
  const notes = preset.notes;
  const n = notes.length || 1;
  const meanInt = notes.reduce((s, x) => s + x.intensity, 0) / n;
  const wave = notes.reduce((s, x) => s + (WAVE_SOFT[x.waveform] ?? 1.6), 0) / n;
  const res = notes.reduce((s, x) => s + (1 - 0.5 * Math.min(Math.abs(x.frequency - 0.4) / 1.6, 1)), 0) / n;
  const total = notes.reduce((s, x) => s + x.on + x.off, 0);
  const on = notes.reduce((s, x) => s + x.on, 0);
  const duty = on / (total || 1);
  const buzz = notes.reduce((s, x) => s + Math.max(0, x.on - 45) / 300, 0);
  const harsh = meanInt * wave * res * (0.6 + 0.8 * duty) * (1 + buzz * 0.8);
  return Math.round(100 / (1 + harsh));
}

function metricsOf(notes, score) {
  const total = notes.reduce((sum, n) => sum + n.on + n.off, 0);
  const on = notes.reduce((sum, n) => sum + n.on, 0);
  const duty = Math.round((on / (total || 1)) * 100);
  const peak = Math.max(...notes.map(n => n.intensity));
  const heavy = peak > 1.6 || total > 700;
  return `<div class="metrics">
      <span>总长 <b>${total}</b> ms</span>
      <span>振动 <b>${on}</b> ms</span>
      <span>占空比 <b>${duty}</b>%</span>
      <span class="${heavy ? "warn" : ""}">峰值强度 <b>${peak.toFixed(2)}</b>${heavy ? " ⚠" : ""}</span>
    </div>
    <div class="softness"><span class="bar" style="width:${score}%"></span><span class="val">轻柔度 ${score}<span class="unit">/100</span></span></div>`;
}

function noteRow(note, index) {
  const waveformOptions = [1,2,3,4,5,6,15,16]
    .map(w => `<option value="${w}" ${w === note.waveform ? "selected" : ""}>${w}</option>`).join("");
  return `<div class="note-row" data-index="${index}">
      <span class="idx">${index + 1}</span>
      <input type="number" class="n-on" value="${note.on}" min="10" max="2000" step="10" title="振动时长 ms">
      <input type="number" class="n-off" value="${note.off}" min="0" max="5000" step="10" title="静默 ms">
      <select class="n-wave" title="波形">${waveformOptions}</select>
      <span class="sl"><label>强度</label><input type="range" class="n-int" min="0" max="2" step="0.05" value="${note.intensity}"><output>${note.intensity}</output></span>
      <span class="sl"><label>音色</label><input type="range" class="n-freq" min="0" max="2" step="0.02" value="${note.frequency}"><output>${note.frequency}</output></span>
      <button class="tiny n-del" title="删除这一音">×</button>
    </div>`;
}

function card(preset, index) {
  const notes = preset.notes;
  return `<article class="card" data-role="${preset.role}" data-id="${preset.id}" data-index="${index}">
    <div class="card-head">
      <span class="id">${preset.id}</span>
      <span class="label">${preset.label}</span>
      <span class="key">${index + 1 <= 9 ? index + 1 : ""}</span>
    </div>
    <div class="timeline">${timeline(notes)}</div>
    ${metricsOf(notes, softness(preset))}
    <div class="row">
      <button class="play primary">▶ 试听</button>
      <button class="copy ghost tiny">复制 sequence</button>
      <button class="edit ghost tiny">编辑</button>
      <button class="save ghost tiny" hidden>保存</button>
    </div>
    <div class="seq">${sequenceOf(notes)}</div>
    <div class="editor">${notes.map(noteRow).join("")}
      <div class="row"><button class="add ghost tiny">+ 加一音</button></div>
    </div>
  </article>`;
}

let sortMode = localStorage.getItem("haptic-lab-sort") || "group";

function sortedPresets() {
  const list = [...presets];
  const totalOf = p => p.notes.reduce((s, n) => s + n.on + n.off, 0);
  const dutyOf = p => {
    const total = totalOf(p) || 1;
    return p.notes.reduce((s, n) => s + n.on, 0) / total;
  };
  const peakOf = p => Math.max(...p.notes.map(n => n.intensity));
  switch (sortMode) {
    case "soft": return list.sort((a, b) => softness(b) - softness(a));
    case "harsh": return list.sort((a, b) => softness(a) - softness(b));
    case "length": return list.sort((a, b) => totalOf(a) - totalOf(b));
    case "peak": return list.sort((a, b) => peakOf(a) - peakOf(b));
    case "duty": return list.sort((a, b) => dutyOf(a) - dutyOf(b));
    default:
      const rank = { done: 0, blocked: 1, demo: 2 };
      return list.sort((a, b) => (rank[a.role] ?? 3) - (rank[b.role] ?? 3) || presets.indexOf(a) - presets.indexOf(b));
  }
}

function render() {
  ordered = sortedPresets();
  const roles = [
    { key: "done", title: "done 候选", hint: "任务完成 —— 上扬、收得住" },
    { key: "blocked", title: "blocked 候选", hint: "需要你拍板 —— 下行/回旋，疑问感" },
    { key: "demo", title: "历史与对照", hint: "之前的版本 + 极端参照" },
  ];
  const indexOf = id => ordered.findIndex(p => p.id === id);
  if (sortMode === "group") {
    $("#groups").innerHTML = roles.map(role => {
      const items = ordered.filter(p => p.role === role.key);
      if (!items.length) return "";
      return `<section><h2>${role.title} <span>${role.hint}</span></h2>
        <div class="grid">${items.map(p => card(p, indexOf(p.id))).join("")}</div></section>`;
    }).join("");
  } else {
    const titles = {
      soft: "按轻柔度排序 <span>从最柔到最强 —— 数字键按这个顺序</span>",
      harsh: "按轻柔度排序 <span>从最强到最柔</span>",
      length: "按总长排序 <span>从短到长</span>",
      peak: "按峰值强度排序 <span>从低到高</span>",
      duty: "按占空比排序 <span>从低到高，越低越省振动板</span>",
    };
    $("#groups").innerHTML = `<section><h2>${titles[sortMode]}</h2>
      <div class="grid">${ordered.map(p => card(p, indexOf(p.id))).join("")}</div></section>`;
  }
  bindCards();
}

async function playPreset(preset) {
  if (stopFlag) return;
  const cardEl = document.querySelector(`.card[data-id="${preset.id}"]`);
  cardEl?.classList.add("playing");
  try {
    const result = await api("/api/play", { id: preset.id });
    if (result.exit_code !== 0) setStatus(`taptic 退出码 ${result.exit_code}：${result.stderr || "无输出"}`, true);
    else setStatus(`播放 ${preset.id}（${result.duration_ms} ms，振动 ${result.on_ms} ms）`);
  } catch (error) {
    setStatus(String(error.message), true);
  } finally {
    cardEl?.classList.remove("playing");
  }
}

function bindCards() {
  document.querySelectorAll(".card").forEach(cardEl => {
    const preset = presets.find(p => p.id === cardEl.dataset.id);
    $(".play", cardEl).addEventListener("click", () => playPreset(preset));
    $(".copy", cardEl).addEventListener("click", async () => {
      const text = sequenceOf(preset.notes);
      try { await navigator.clipboard.writeText(text); setStatus("已复制 sequence 到剪贴板"); }
      catch { setStatus("复制失败，请手动选下面那行文本"); }
    });
    const editBtn = $(".edit", cardEl);
    const saveBtn = $(".save", cardEl);
    editBtn.addEventListener("click", () => {
      const editing = cardEl.classList.toggle("editing");
      editBtn.textContent = editing ? "收起" : "编辑";
      saveBtn.hidden = !editing;
    });
    $(".add", cardEl).addEventListener("click", () => {
      preset.notes.push({ on: 60, off: 60, waveform: 4, intensity: 1.4, frequency: 0.4 });
      refresh(preset);
    });
    cardEl.addEventListener("input", event => {
      const row = event.target.closest(".note-row");
      if (!row) return;
      const note = preset.notes[Number(row.dataset.index)];
      if (!note) return;
      if (event.target.classList.contains("n-int")) note.intensity = Number(event.target.value);
      if (event.target.classList.contains("n-freq")) note.frequency = Number(event.target.value);
      if (event.target.classList.contains("n-on")) note.on = Number(event.target.value);
      if (event.target.classList.contains("n-off")) note.off = Number(event.target.value);
      const out = row.querySelector(".n-int") ? row.querySelectorAll("output") : [];
      if (out[0]) out[0].textContent = note.intensity;
      if (out[1]) out[1].textContent = note.frequency;
      $(".seq", cardEl).textContent = sequenceOf(preset.notes);
      $(".timeline", cardEl).innerHTML = timeline(preset.notes);
      $(".metrics", cardEl).outerHTML = metricsOf(preset.notes);
    });
    cardEl.addEventListener("change", event => {
      const row = event.target.closest(".note-row");
      if (!row) return;
      const note = preset.notes[Number(row.dataset.index)];
      if (!note) return;
      if (event.target.classList.contains("n-wave")) note.waveform = Number(event.target.value);
    });
    cardEl.addEventListener("click", event => {
      if (!event.target.classList.contains("n-del")) return;
      const row = event.target.closest(".note-row");
      preset.notes.splice(Number(row.dataset.index), 1);
      if (!preset.notes.length) preset.notes.push({ on: 60, off: 60, waveform: 4, intensity: 1.4, frequency: 0.4 });
      refresh(preset);
    });
    saveBtn.addEventListener("click", async () => {
      try {
        await api("/api/save", { id: preset.id, notes: preset.notes });
        setStatus(`已保存 ${preset.id} 到 presets.json`);
      } catch (error) {
        setStatus(String(error.message), true);
      }
    });
  });
}

function refresh(preset) {
  const keepEditing = document.querySelector(`.card[data-id="${preset.id}"]`)?.classList.contains("editing");
  const idx = presets.indexOf(preset);
  const holder = document.createElement("div");
  holder.innerHTML = card(preset, idx);
  const fresh = holder.firstElementChild;
  const old = document.querySelector(`.card[data-id="${preset.id}"]`);
  old.replaceWith(fresh);
  if (keepEditing) { fresh.classList.add("editing"); $(".save", fresh).hidden = false; $(".edit", fresh).textContent = "收起"; }
  bindCards();
}

async function compareAll() {
  stopFlag = false;
  const gap = Math.max(0, Number($("#gap").value) || 0);
  const order = sortedPresets();
  for (const preset of order) {
    if (stopFlag) break;
    setStatus(`对比中：${preset.id} ${preset.label}`);
    await playPreset(preset);
    await new Promise(resolve => setTimeout(resolve, gap));
  }
  if (!stopFlag) setStatus("对比结束");
}

$("#compare").addEventListener("click", compareAll);
$("#sort").addEventListener("change", event => {
  sortMode = event.target.value;
  localStorage.setItem("haptic-lab-sort", sortMode);
  render();
});
$("#stop").addEventListener("click", async () => {
  stopFlag = true;
  try { await api("/api/stop", {}); setStatus("已停止"); } catch (error) { setStatus(String(error.message), true); }
});
document.addEventListener("keydown", event => {
  if (event.target.matches("input, select, textarea")) return;
  if (event.key === "Escape") { $("#stop").click(); return; }
  const n = Number(event.key);
  if (n >= 1 && n <= 9 && ordered[n - 1]) playPreset(ordered[n - 1]);
});

async function loadPresets(announce = true) {
  try {
    const health = await api("/api/health");
    if (!health.exists) { setStatus("找不到 taptic 可执行文件", true); return; }
    const data = await api("/api/presets");
    presets = data.presets;
    $("#sort").value = sortMode;
    render();
    if (announce) setStatus(`已载入 ${presets.length} 个预设 —— 点击卡片试听`);
  } catch (error) {
    setStatus(String(error.message), true);
  }
}

$("#reload").addEventListener("click", () => loadPresets(true));
loadPresets();
</script>
</body>
</html>
